[package]
name = "forceshot"
description = "TRK ForceShot - skarmklipp och bildredigering for provningsdokumentation"
version = "2.2.3"
edition = "2024"

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
egui = "0.37"
egui-wgpu = { version = "0.37", features = ["winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }
hayro = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif", "webp"] }
include_dir = "0.7.4"
log = "0.4.35"
pollster = "1.0.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tray-icon = "0.26.1"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
wgpu = "30"
winit = "0.30"
wry = "0.57.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation_Collections"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Mapi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.10.0"
objc2 = "0.6.5"
xcap = "0.9.10"

[build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "TRK-ForceShot"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# Bildoperationerna (oskärpa, mosaik) ska vara snabba även i utvecklingsbyggen.
[profile.dev.package."*"]
opt-level = 2
