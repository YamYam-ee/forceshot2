<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Tankskiss</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">

  <aside id="panel">
    <h1>Tankskiss</h1>

    <section>
      <h2>Tank</h2>

      <label>Diameter
        <span class="unit">mm</span>
        <input id="diameter" type="number" min="200" max="6000" step="10" value="2400">
      </label>

      <label>Längd första–sista rundskarv
        <span class="unit">mm</span>
        <input id="length" type="number" min="500" max="30000" step="10" value="6560">
      </label>

      <label>Antal rundskarvar
        <span class="hint" id="course-hint"></span>
        <input id="seams" type="number" min="2" max="24" step="1" value="5">
      </label>

      <label>Gaveldjup
        <span class="unit">% av diametern</span>
        <input id="dish" type="number" min="5" max="50" step="1" value="25">
      </label>
    </section>

    <section>
      <h2>Långskarvar</h2>

      <label>Avstånd från centrum
        <span class="unit">% av radien</span>
        <input id="offset" type="number" min="0" max="95" step="5" value="45">
      </label>

      <label>Första långskarven
        <select id="start-side">
          <option value="up">Uppe</option>
          <option value="down">Nere</option>
        </select>
      </label>

      <div class="row">
        <button id="alt-every" class="ghost">Varannan</button>
        <button id="alt-all-up" class="ghost">Alla uppe</button>
        <button id="alt-all-down" class="ghost">Alla nere</button>
      </div>

      <p class="note">
        Dra i en långskarv för att flytta just den. Håll <kbd>Skift</kbd> så följer
        alla skarvar på samma sida med.
      </p>
    </section>

    <section>
      <h2>Tillbehör</h2>
      <div class="row wrap">
        <button data-add="flans" class="ghost">Fläns</button>
        <button data-add="pastick" class="ghost">Påstick</button>
        <button data-add="manlucka" class="ghost">Manlucka</button>
      </div>
      <p class="note">
        Klicka på knappen och sedan på tanken. Dra för att flytta,
        <kbd>Delete</kbd> tar bort det markerade.
      </p>
    </section>

    <section>
      <h2>Namnruta</h2>
      <label>Beteckning
        <input id="title" type="text" value="Tank T3 LR 125 vakuum, Y-7641">
      </label>
    </section>

    <section>
      <div class="row">
        <button id="reset" class="ghost">Återställ skarvar</button>
        <button id="export" class="primary">Till bildredigeraren</button>
      </div>
      <p class="note" id="scale-note"></p>
    </section>
  </aside>

  <main id="stage">
    <svg id="sheet" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="status"></div>
  </main>

</div>

<script src="js/model.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
